{% if article %}
<script type="application/ld+json">
  {
    "@context": "http://schema.org",
    "@type": "BlogPosting",
    "name": "{{ article.title }}",
    "headline": "{{ article.title }}",
    "image": "{{ SITEURL }}/{{ SITELOGO }}",
    "url": "{{ (SITEURL ~ '/') | urljoin(article.url) }}",
    "description": "{{ article.summary|striptags|e }}",
    "author": {
      "@type": "Person",
      "name": "{{ AUTHOR }}",
      "url": "{{ SITEURL }}"
    },
    "publisher": {
      "@type": "Organization",
      "name": "{{ AUTHOR }}",
      "logo": {
        "@type": "ImageObject",
        "url": "{{ SITEURL }}/{{ SITELOGO }}"
      }
    },
    "datePublished": "{{ article.date }}",
    "dateModified": "{{ article.date }}"
  }
</script>

{% else %}

<script type="application/ld+json">
  {
    "@context": "https://schema.org/",
    "@type": "Person",
    "name": "{{ AUTHOR }}",
    "description": "Technologist and consultant working across machine learning, data, software, and people.",
    "url": "{{ SITEURL }}",
    "image": "{{ SITEURL }}/{{ SITELOGO }}",
    "sameAs": [
      "https://x.com/duarteocarmo",
      "https://github.com/duarteocarmo",
      "{{ SITEURL }}"
    ],
    "jobTitle": "Technologist/Consultant",
    "worksFor": {
      "@type": "Organization",
      "name": "{{ AUTHOR }}"
    }
  }
</script>

{% if page and page.slug == "consulting" %}
<script type="application/ld+json">
  {
    "@context": "https://schema.org/",
    "@type": "Service",
    "name": "Technology consulting by {{ AUTHOR }}",
    "description": "Machine learning, data, and software consulting focused on solving hard problems end-to-end.",
    "url": "{{ SITEURL }}/{{ page.url }}",
    "serviceType": "Machine learning, data, and software consulting",
    "provider": {
      "@type": "Person",
      "name": "{{ AUTHOR }}",
      "url": "{{ SITEURL }}"
    }
  }
</script>
{% endif %}
{% endif %}

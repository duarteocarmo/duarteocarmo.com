[project]
name = "duarteocarmo-com"
version = "0.1.0"
description = "Personal website of Duarte O.Carmo"
requires-python = ">=3.11"
dependencies = [
  "pelican==4.12.0",
  "pelican-feed-filter==1.1.0",
  "pelican-simple-footnotes==1.0.3",
  "pelican-sitemap==1.1.0",
  "markdown==3.10.3",
  "pygments==2.19.2",
  "boto3==1.43.67",
  "diskcache==5.6.3",
  "feedparser==6.0.14",
  "markdownify==1.2.3",
  "pytz==2026.3.post1",
  "watchfiles==1.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
    "ty>=0.0.69",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"plugins/*/__init__.py" = ["F403"]
"publishconf.py" = ["F403"]
"pelicanconf.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
